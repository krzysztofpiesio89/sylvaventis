name: Lighthouse CI
on: [push, pull_request]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          NEXT_PUBLIC_GRAPHQL_URL: ${{ secrets.NEXT_PUBLIC_GRAPHQL_URL }}
          NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.NEXT_PUBLIC_ALGOLIA_APP_ID || 'changeme' }}
          NEXT_PUBLIC_ALGOLIA_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_PUBLIC_API_KEY || 'changeme' }}
          NEXT_PUBLIC_PLACEHOLDER_SMALL_IMAGE_URL: "https://via.placeholder.com/200"
          NEXT_PUBLIC_PLACEHOLDER_LARGE_IMAGE_URL: "https://via.placeholder.com/600"
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm run start &
          echo "Waiting for server to be ready..."
          while ! nc -z localhost 3000; do
            sleep 5
          done
          sleep 10
          npm run lhci:perf || npx @lhci/cli autorun
        env:
          NEXT_PUBLIC_GRAPHQL_URL: ${{ secrets.NEXT_PUBLIC_GRAPHQL_URL }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
